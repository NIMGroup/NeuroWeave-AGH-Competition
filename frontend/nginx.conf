server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # FastAPI is reached through the existing gateway, never the SPA fallback.
    location /api/ { return 404; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        # Reproducible archives can give different HTML the same mtime and size.
        # Always return the current entrypoint instead of a stale 304 response.
        etag off;
        if_modified_since off;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
