name: NeuroWeave AGH competition checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bakend/requirements*.lock
      - run: python -m pip install --no-deps -r bakend/requirements-dev.lock
      - run: python -m pip check
      - run: python -m pytest bakend/tests -q --tb=short
        env:
          PYTHONPATH: bakend
          LOCALFLOW_SLURM_ENABLED: 'false'
      - run: python scripts/check_release.py
      - run: python scripts/build_capability_tree.py --check
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:agh
      - run: node --test ../scripts/hackathon/server-plugin-tests.mjs
